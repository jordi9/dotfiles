# Global fallback versions. Projects can override these in their own mise.toml.
[settings.go]
set_gobin = false

[settings.npm]
package_manager = "pnpm"

[tools]
bun = "1"
go = "1.26"
gradle = "9"
java = "temurin-25"
node = "26"
pnpm = "12"
ruby = "3.4"
# The wrapper package does not expose its platform dependency's executable.
"npm:@kitlangton/terminal-control-darwin-arm64" = "latest"
"npm:@ticktick/ticktick-cli" = "latest"
"npm:agent-browser" = "latest"
"npm:hunkdiff" = "latest"
"npm:slop-scan" = "latest"
"npm:wrangler" = "latest"

[env]
GOBIN = "{{ env.HOME }}/.local/bin"
GOCACHE = "{{ env.HOME }}/.cache/go-build"
GOMODCACHE = "{{ env.HOME }}/.cache/go-mod"
GOPATH = "{{ env.HOME }}/.local/share/go"
